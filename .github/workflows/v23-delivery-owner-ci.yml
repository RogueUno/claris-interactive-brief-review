name: V2.3 Delivery Ownership Safety
on:
  push:
    branches: [main, v23-delivery-owner-gate-20261004, fix/submitted-final-delivery-content-gate-20261010]
    paths:
      - 'api/clarification/admin/package.mjs'
      - 'clarification-v1/server/**'
      - 'calibration-v3/server/make-delivery-transport.mjs'
      - 'calibration-v3/server/tests/make-delivery-transport.test.mjs'
      - 'calibration-v3/server/runtime-export.mjs'
      - 'calibration-v3/server/blob-storage.mjs'
      - 'clarification-v1/server/api-shared.mjs'
      - '.github/workflows/v23-delivery-owner-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/clarification/admin/package.mjs'
      - 'clarification-v1/server/**'
      - 'calibration-v3/server/runtime-export.mjs'
      - 'calibration-v3/server/blob-storage.mjs'
      - 'clarification-v1/server/api-shared.mjs'
  workflow_dispatch:

jobs:
  owner-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
      - name: Check syntax
        run: |
          node --check candidate/api/clarification/admin/package.mjs
          node --check candidate/clarification-v1/server/finalize-handoff.mjs
          node --check candidate/clarification-v1/server/verify-locked-delivery-owner.mjs
      - name: Verify locked owner isolation
        run: |
          node --test candidate/clarification-v1/server/tests/verify-locked-delivery-owner.test.mjs
          node --test candidate/clarification-v1/server/tests/offline-delivery-lifecycle.test.mjs
          node --test candidate/clarification-v1/server/tests/final-delivery-receipt.test.mjs
          node --test candidate/clarification-v1/server/tests/atomic-clarification-create.test.mjs
      - name: Install production dependencies for API route regression
        run: npm install --omit=dev --no-audit --no-fund --package-lock=false --prefix candidate
      - name: Verify synthetic booking no-contact boundary across FINALIZE intelligence
        run: node --test candidate/clarification-v1/server/tests/booking-scope-boundary-review.test.mjs
      - name: Verify narrow prospect claim and accepted answer consistency without semantic promotion
        run: node --test candidate/clarification-v1/server/tests/prospect-claim-consistency.test.mjs
      - name: Verify read-only live FINALIZE candidate comparison and authorization
        run: node --test candidate/clarification-v1/server/tests/final-snapshot-candidate-preflight.test.mjs candidate/clarification-v1/server/tests/final-snapshot-candidate-preflight-api.test.mjs
      - name: Verify authenticated read-only snapshot source preflight
        run: node --test candidate/clarification-v1/server/tests/final-snapshot-source-preflight.test.mjs candidate/clarification-v1/server/tests/final-snapshot-source-preflight-api.test.mjs
      - name: Verify accepted PROS evidence IDs and historical FINALIZE replay offline
        run: node --test candidate/clarification-v1/server/tests/accepted-prospect-evidence.test.mjs
      - name: Verify atomic append-once governed FINALIZE snapshot and disabled route
        run: node --test candidate/clarification-v1/server/tests/final-snapshot-persistence.test.mjs candidate/clarification-v1/server/tests/final-snapshot-persistence-api.test.mjs
      - name: Verify read-only administrative discovery preview
        run: node --test candidate/clarification-v1/server/tests/admin-discovery-preview.test.mjs candidate/clarification-v1/server/tests/admin-discovery-preview-api.test.mjs
      - name: Verify persisted booking canonical agreement before discovery drafts
        run: node --test candidate/clarification-v1/server/tests/persisted-booking-discovery-gate.test.mjs
      - name: Verify evidence-constrained offline question drafting and no-contact boundary
        run: node --test candidate/clarification-v1/server/tests/evidence-constrained-question-drafts.test.mjs
      - name: Verify grounded deterministic first-call question prioritization
        run: node --test candidate/clarification-v1/server/tests/discovery-prioritizer.test.mjs
      - name: Verify question relevance breadth on actual FINALIZE payloads
        run: node --test candidate/clarification-v1/server/tests/discovery-coverage.test.mjs
      - name: Verify commercial depth review baseline
        run: node --test candidate/clarification-v1/server/tests/commercial-brief-readiness.test.mjs
      - name: Verify exact Oct10 FINALIZE intelligence preservation and depth
        run: node --test candidate/clarification-v1/server/tests/oct10-finalize-schema-replay.test.mjs
      - name: Verify realistic fictional SOC2 brief quality offline
        run: node --test candidate/clarification-v1/server/tests/fictional-soc2-advisory.test.mjs
      - name: Verify exact protected submitted Make form transport
        run: node --test candidate/calibration-v3/server/tests/make-delivery-transport.test.mjs
      - name: Compare FINALIZE baseline tests (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch main "https://github.com/${{ github.repository }}.git" baseline
          node --test baseline/clarification-v1/server/tests/finalize-handoff.test.mjs >baseline.log 2>&1 || true
          node --test candidate/clarification-v1/server/tests/finalize-handoff.test.mjs >candidate.log 2>&1 || true
          grep '^not ok ' baseline.log | sed -E 's/^not ok [0-9]+ - //' | sort -u >baseline.fail || true
          grep '^not ok ' candidate.log | sed -E 's/^not ok [0-9]+ - //' | sort -u >candidate.fail || true
          comm -13 baseline.fail candidate.fail >new.fail
          if [ -s new.fail ]; then
            echo 'New FINALIZE test regressions:'
            cat new.fail
            while IFS= read -r failure; do
              grep -F -A 24 -- " - ${failure}" candidate.log | head -n 30 || true
            done <new.fail
            exit 1
          fi
          echo 'No new FINALIZE regressions.'
