name: V2.3 Direct Final Safety

on:
  push:
    branches: [v23-direct-final-clean-20261004, candidate/trusted-booking-facts-20261007]
  pull_request:
    branches: [v23-delivery-owner-gate-20261004, main]
    paths:
      - 'api/delivery/package.mjs'
      - 'api/calendly/normalize.mjs'
      - 'calibration-v3/server/calendly-booking-normalizer.mjs'
      - 'calibration-v3/server/tests/calendly-*.test.mjs'
      - 'calibration-v3/server/direct-final-outbox.mjs'
      - 'calibration-v3/server/blob-storage.mjs'
      - 'clarification-v1/server/tests/direct-final-*.test.mjs'
      - '.github/workflows/v23-direct-final-ci.yml'
  workflow_dispatch:

jobs:
  direct-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
      - name: Verify ES modules
        run: |
          node --check api/delivery/package.mjs
          node --check api/calendly/normalize.mjs
          node --check calibration-v3/server/calendly-booking-normalizer.mjs
          node --check calibration-v3/server/direct-final-outbox.mjs
          node --check calibration-v3/server/blob-storage.mjs
      - name: Offline no-provider delivery certification
        run: |
          node --test clarification-v1/server/tests/direct-final-outbox.test.mjs
          node --test clarification-v1/server/tests/recovery-attestation-candidate.test.mjs
          node --test clarification-v1/server/tests/recovery-attestation-evidence.test.mjs
          node --test clarification-v1/server/tests/recovery-attestation-writer.test.mjs
          node --test clarification-v1/server/tests/make-recovery-execution-classifier.test.mjs
          node --test clarification-v1/server/tests/recovery-operator-approval.test.mjs
          node --test clarification-v1/server/tests/recovery-approval-consumption.test.mjs
          node --test clarification-v1/server/tests/first-mvp-cutover-preflight.test.mjs
          node --test clarification-v1/server/tests/first-mvp-nosend-rehearsal.test.mjs
          node --test clarification-v1/server/tests/multi-choice-exclusivity.test.mjs
          node --test clarification-v1/server/tests/make-read-only-inspector.test.mjs
          node --test clarification-v1/server/tests/make-inspector-diagnostic.test.mjs
          node --test clarification-v1/server/tests/direct-final-gateway.test.mjs
          node --test clarification-v1/server/tests/direct-final-calendly-bridge.test.mjs
          node --test calibration-v3/server/tests/calendly-booking-normalizer.test.mjs
          node --test calibration-v3/server/tests/calendly-normalize-api.test.mjs
      - name: Original owner tests must remain safe
        run: |
          node --test clarification-v1/server/tests/verify-locked-delivery-owner.test.mjs
          node --test clarification-v1/server/tests/final-delivery-receipt.test.mjs
