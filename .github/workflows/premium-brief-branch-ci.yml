name: Premium Brief Branch CI

on:
  push:
    branches:
      - premium-gauntlet-v3-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:premium
      - run: npm run test:calibration
      - run: npm run test:brief
      - run: node --check brief-v1/app.mjs

  preview-smoke:
    needs: brief
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW: https://claris-calibration-git-pre-685ffe-mehdimedjahed3-2420s-projects.vercel.app
    steps:
      - name: Probe branch preview
        shell: bash
        run: |
          code="$(curl -sS -L -o /tmp/brief.html -w '%{http_code}' "$PREVIEW/brief-v1/" || true)"
          echo "brief page status=$code"
          test "$code" = "200"

          if grep -q "CLARIS · Private Brief" /tmp/brief.html; then
            echo "CLARIS preview content is directly reachable."
            echo "CLARIS_REACHABLE=true" >> "$GITHUB_ENV"
          else
            title="$(grep -o '<title>[^<]*</title>' /tmp/brief.html | head -1 || true)"
            echo "::notice::Preview returned HTTP 200 but CLARIS HTML is hidden by Vercel preview protection/interstitial. title=$title"
            echo "CLARIS_REACHABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Unauthenticated private publish fails closed
        if: env.CLARIS_REACHABLE == 'true'
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/unauth.json -w '%{http_code}'             -X POST "$PREVIEW/api/delivery/package"             -H 'content-type: application/json'             -H 'x-claris-delivery: brief_create'             --data '{"consultant_id":"smoke_test","company":"Smoke","brief_payload":{}}')"
          echo "unauth publish status=$code"
          cat /tmp/unauth.json
          test "$code" = "401"
          grep -q "MAKE_UNAUTHORIZED" /tmp/unauth.json
