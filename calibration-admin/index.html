<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#243943"><title>CLARIS — Invite Console</title><link rel="preconnect" href="https://rsms.me"><link rel="stylesheet" href="https://rsms.me/inter/inter.css"><link rel="stylesheet" href="./styles.css?v=1.0"></head><body><main class="shell"><section class="card"><div class="eyebrow">CLARIS · Admin</div><h1>Create a seeded calibration invite</h1><p class="lede">This utility creates a test-ready consultant session using the protected admin endpoint. Your admin key is never stored in the browser.</p><form id="invite-form"><label>Admin key<input id="admin-key" type="password" autocomplete="off" required></label><div class="grid"><label>Consultant ID<input id="consultant-id" required pattern="[A-Za-z0-9_-]{3,80}"></label><label>First name<input id="first-name" required></label><label>Full name<input id="full-name" required></label><label>Firm<input id="firm" required></label></div><label>Invite lifetime<select id="ttl"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option></select></label><button id="submit" type="submit">Create demo-seeded invite</button></form><div id="status" class="status" aria-live="polite"></div><div id="result" class="result" hidden><label>Invite URL<div class="copy-row"><input id="invite-url" readonly><button id="copy" type="button" class="secondary">Copy</button></div></label><a id="open" class="open-link" target="_blank" rel="noopener">Open calibration</a></div></section></main><script type="module" src="./app.mjs?v=1.0"></script></body></html>
